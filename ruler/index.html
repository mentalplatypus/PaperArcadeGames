<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>try{var t=localStorage.getItem("theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
<title>Ruler Merge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Chivo+Mono:wght@400;600&display=swap">
<style>
  /* Layout: one centered column — title with goal, score row, square 4×4 board, controls and links below. */
  :root {
    --paper: #eef3f7;
    --board: #fbfdff;
    --grid: #cfe0ee;
    --grid-major: #a9c6de;
    --ink: #1d2a44;
    --ink-soft: #5b6a85;
    --apple: #d6372b;
    --veil: rgba(251, 253, 255, 0.88);
    /* tile fills, one per length: 1, 2, 4, 8, 16, 32, 64 cm, 128 cm (the goal), and beyond */
    --t0: #e3edf7; --t1: #d0e1f1; --t2: #b9d2ea; --t3: #9cbfe2; --t4: #7ba7d6;
    --t5: #5689c6; --t6: #366aae; --t7: #d6372b; --t8: #1d2a44;
    --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
    --font-mono: "Chivo Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #0c1830; --board: #10203d; --grid: #1c3358; --grid-major: #2a4a7a;
      --ink: #e8f0ff; --ink-soft: #8ea3c7; --apple: #ff6a55; --veil: rgba(16, 32, 61, 0.88);
      --t0: #1b335a; --t1: #22406e; --t2: #2b4e84; --t3: #365e9c; --t4: #4873b6;
      --t5: #6c95d2; --t6: #9dbdf0; --t7: #ff6a55; --t8: #e8f0ff;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #0c1830; --board: #10203d; --grid: #1c3358; --grid-major: #2a4a7a;
    --ink: #e8f0ff; --ink-soft: #8ea3c7; --apple: #ff6a55; --veil: rgba(16, 32, 61, 0.88);
    --t0: #1b335a; --t1: #22406e; --t2: #2b4e84; --t3: #365e9c; --t4: #4873b6;
    --t5: #6c95d2; --t6: #9dbdf0; --t7: #ff6a55; --t8: #e8f0ff;
    color-scheme: dark;
  }

  [hidden] { display: none !important; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-mono);
    display: flex;
    justify-content: center;
    padding-block: 60px 24px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .wrap { width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 16px; }

  header { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { font-family: var(--font-display); font-weight: 800; font-size: 2.1rem; letter-spacing: -0.03em; line-height: 1; margin: 0; }
  h1 small {
    display: block; font-family: var(--font-mono); font-weight: 400; font-size: 0.72rem;
    letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-soft); margin-top: 6px;
  }
  .scores { display: flex; gap: 18px; font-variant-numeric: tabular-nums; }
  .score { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
  .score span { font-size: 0.68rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-soft); }
  .score b { font-family: var(--font-display); font-weight: 800; font-size: 1.6rem; line-height: 1; }

  .board {
    position: relative; width: 100%; max-width: 100%; aspect-ratio: 1; box-sizing: border-box;
    background-color: var(--board);
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: calc(100% / 16) calc(100% / 16);
    border: 2px solid var(--ink); border-radius: 4px;
    box-shadow: 6px 6px 0 var(--grid-major);
    touch-action: none; user-select: none; -webkit-user-select: none;
  }
  .layer { position: absolute; inset: 6px; }
  .slot, .tile {
    position: absolute; left: 0; top: 0; width: 25%; height: 25%; padding: 5px; box-sizing: border-box;
  }
  .slot::before {
    content: ""; display: block; height: 100%; box-sizing: border-box;
    border: 1.5px dashed var(--grid-major); border-radius: 3px;
  }
  .slot.blot::before { border: 0; }
  .slot svg { position: absolute; inset: 5px; width: calc(100% - 10px); height: calc(100% - 10px); }

  .tile { transition: transform 0.11s ease-in-out; }
  .face {
    position: relative; height: 100%; border-radius: 3px; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.14);
    color: var(--ink);
  }
  .len { font: 800 clamp(15px, 5.2vw, 27px) / 1 var(--font-display); letter-spacing: -0.02em; margin-bottom: 14%; }
  /* the ruler bar along the bottom grows with each merge */
  .rule {
    position: absolute; left: 10%; bottom: 13%; height: 13%; width: var(--w);
    border-bottom: 2px solid currentColor; opacity: 0.6;
    background: repeating-linear-gradient(90deg, currentColor 0 1.5px, transparent 1.5px 7px) left bottom / 100% 70% no-repeat;
  }
  .lv0 { background: var(--t0); } .lv1 { background: var(--t1); } .lv2 { background: var(--t2); }
  .lv3 { background: var(--t3); } .lv4 { background: var(--t4); }
  .lv5 { background: var(--t5); color: var(--board); } .lv6 { background: var(--t6); color: var(--board); }
  .lv7 { background: var(--t7); color: var(--board); } .lv8 { background: var(--t8); color: var(--board); }

  .face.appear { animation: appear 0.16s ease-out; }
  .face.pop { animation: pop 0.16s ease-out; }
  @keyframes appear { from { transform: scale(0.3); opacity: 0; } }
  @keyframes pop { 50% { transform: scale(1.12); } }

  .overlay {
    position: absolute; inset: 0; z-index: 2; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 10px; text-align: center;
    background: var(--veil); padding: 16px;
  }
  .overlay h2 { font-family: var(--font-display); font-weight: 800; font-size: 1.9rem; margin: 0; letter-spacing: -0.02em; }
  .overlay p { margin: 0; color: var(--ink-soft); font-size: 0.85rem; max-width: 30ch; line-height: 1.5; }
  .overlay .buttons { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }

  .btn {
    font: 600 0.9rem var(--font-mono); color: var(--board); background: var(--ink);
    border: 2px solid var(--ink); border-radius: 4px; padding: 10px 18px; cursor: pointer;
  }
  .btn.quiet { background: transparent; color: var(--ink); }
  .btn:hover { filter: brightness(1.15); }
  .ghost {
    font: 600 0.9rem var(--font-mono); color: var(--ink); text-decoration: none;
    border: 2px solid var(--ink); border-radius: 4px; padding: 8px 14px;
  }
  .ghost:hover { background: var(--grid); }
  .btn:focus-visible, .ghost:focus-visible { outline: 3px solid var(--apple); outline-offset: 2px; }

  .bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .hint { font-size: 0.75rem; line-height: 1.6; color: var(--ink-soft); max-width: 34ch; }
  kbd {
    font: 600 0.72rem var(--font-mono); border: 1px solid var(--grid-major); border-bottom-width: 2px;
    border-radius: 3px; padding: 0 5px; color: var(--ink); background: var(--board);
  }

  @media (prefers-reduced-motion: reduce) {
    .tile { transition: none; }
    .face.appear, .face.pop { animation: none; }
  }

  /* light/dark switch, top right on every page of the site; the choice is shared through localStorage "theme" */
  .theme-toggle {
    position: absolute; top: 12px; right: max(16px, env(safe-area-inset-right, 0px)); z-index: 10;
    width: 36px; height: 36px; padding: 0; display: grid; place-items: center; border-radius: 50%; cursor: pointer;
    color: var(--ink); background: var(--surface, var(--board, transparent)); border: 1px solid var(--line, var(--grid-major));
    transition: border-color 0.15s, color 0.15s;
  }
  .theme-toggle:hover { color: var(--accent, var(--apple)); border-color: var(--accent, var(--apple)); }
  .theme-toggle:focus-visible { outline: 3px solid var(--accent, var(--apple)); outline-offset: 3px; }
  .theme-toggle svg { width: 18px; height: 18px; display: block; }
</style>

<button class="theme-toggle" type="button"></button>
<script>
  // Light/dark switch. Follows the device until clicked, then remembers the choice for every page on this site.
  (function () {
    var root = document.documentElement, btn = document.querySelector(".theme-toggle"), mq = matchMedia("(prefers-color-scheme: dark)");
    var SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 1.5v2.5M12 20v2.5M1.5 12H4M20 12h2.5M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8"/></svg>';
    var MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z"/></svg>';
    function current() { return root.dataset.theme || (mq.matches ? "dark" : "light"); }
    function paint() {
      var dark = current() === "dark", label = dark ? "Switch to light mode" : "Switch to dark mode";
      btn.innerHTML = dark ? SUN : MOON; btn.setAttribute("aria-label", label); btn.title = label;
    }
    function apply(t) { root.dataset.theme = t; paint(); window.dispatchEvent(new Event("themechange")); }
    btn.addEventListener("click", function () {
      var t = current() === "dark" ? "light" : "dark";
      try { localStorage.setItem("theme", t); } catch (e) {}
      apply(t);
    });
    window.addEventListener("storage", function (e) { if (e.key === "theme" && (e.newValue === "light" || e.newValue === "dark")) apply(e.newValue); });
    mq.addEventListener("change", paint);
    paint();
  })();
</script>

<div class="wrap">
  <header>
    <h1>Ruler Merge<small>Goal: make a 128 cm line</small></h1>
    <div class="scores">
      <div class="score"><span>Drawn</span><b id="score">0</b></div>
      <div class="score"><span>Best</span><b id="best">0</b></div>
    </div>
  </header>

  <div class="board" id="board">
    <div class="layer" id="slots"></div>
    <div class="layer" id="tiles"></div>
    <div class="overlay" id="overlay" hidden>
      <h2 id="ov-title"></h2>
      <p id="ov-text"></p>
      <div class="buttons">
        <button class="btn" id="ov-main"></button>
        <button class="btn quiet" id="ov-alt" hidden>New game</button>
      </div>
    </div>
  </div>

  <div class="bar">
    <div class="hint">
      Slide with <kbd>←</kbd><kbd>↑</kbd><kbd>↓</kbd><kbd>→</kbd>, <kbd>WASD</kbd>, or a swipe.
      Equal lengths join and double. Reach 128 cm to win. Ink blots block the way.
    </div>
    <button class="btn" id="new-game">New game</button>
  </div>

  <div>
    <a class="ghost" href="../index.html">← All games</a>
  </div>
</div>

<script>
(() => {
  const N = 4;
  const GOAL = 128;   // first length past one metre
  const BLOTS = 2;    // ink-blot squares per game
  const SLIDE_MS = 110;

  const slotsEl = document.getElementById("slots");
  const tilesEl = document.getElementById("tiles");
  const boardEl = document.getElementById("board");
  const scoreEl = document.getElementById("score");
  const bestEl = document.getElementById("best");
  const overlay = document.getElementById("overlay");
  const ovTitle = document.getElementById("ov-title");
  const ovText = document.getElementById("ov-text");
  const ovMain = document.getElementById("ov-main");
  const ovAlt = document.getElementById("ov-alt");

  let tiles, blots, score, best = 0, won, over, nextId = 0, pending = null, ovAction = null;
  try { best = parseInt(localStorage.getItem("ruler-best"), 10) || 0; } catch (e) {}
  bestEl.textContent = best;

  const label = v => v < 100 ? `${v} cm` : `${(v / 100).toFixed(2)} m`;
  const level = v => Math.min(8, Math.log2(v));
  const key = (r, c) => r * N + c;

  // ---- sound (same synth as the other games; the context starts on the first move) ----
  let audio = null, noise = null;
  function initAudio() {
    try {
      if (!audio) {
        audio = new (window.AudioContext || window.webkitAudioContext)();
        noise = audio.createBuffer(1, audio.sampleRate, audio.sampleRate);
        const data = noise.getChannelData(0);
        for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
      }
      if (audio.state === "suspended") audio.resume();
    } catch (e) { audio = null; }
  }

  // soft pencil stroke, as in Tic-Tac-Toe
  function scratch(startAt, dur) {
    if (!audio) return;
    const t = audio.currentTime + startAt;
    const src = audio.createBufferSource();
    src.buffer = noise;
    src.playbackRate.value = 0.9 + Math.random() * 0.2;
    const band = audio.createBiquadFilter();
    band.type = "bandpass";
    band.frequency.setValueAtTime(1100 + Math.random() * 250, t);
    band.frequency.linearRampToValueAtTime(1500, t + dur);
    band.Q.value = 0.7;
    const soften = audio.createBiquadFilter();
    soften.type = "lowpass";
    soften.frequency.value = 2200;
    const gain = audio.createGain();
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(0.06, t + 0.05);
    gain.gain.setValueAtTime(0.05, t + dur * 0.7);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(band).connect(soften).connect(gain).connect(audio.destination);
    src.start(t, Math.random() * 0.5, dur + 0.05);
  }

  function tone(type, from, to, startAt, dur, vol) {
    if (!audio) return;
    const t = audio.currentTime + startAt;
    const osc = audio.createOscillator();
    const gain = audio.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(from, t);
    osc.frequency.exponentialRampToValueAtTime(to, t + dur);
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(vol, t + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(audio.destination);
    osc.start(t);
    osc.stop(t + dur + 0.02);
  }

  // Snake's apple blip, pitched up as the joined length grows
  function playMerge(v) {
    const base = 400 * Math.pow(2, Math.min(level(v), 9) / 4);
    tone("square", base, base * 2, 0, 0.09, 0.07);
  }

  function playVictory() {
    [523, 659, 784].forEach((f, i) => tone("square", f, f, i * 0.12, 0.12, 0.08));
    tone("square", 1047, 1047, 0.36, 0.5, 0.09);
    tone("triangle", 523, 523, 0.36, 0.5, 0.15);
  }

  function playDefeat() {
    tone("triangle", 440, 415, 0, 0.18, 0.2);
    tone("triangle", 349, 330, 0.18, 0.18, 0.2);
    tone("triangle", 262, 110, 0.36, 0.5, 0.22);
  }

  // ---- board ----
  // An ink blot, different each time: one main blot at the impact point, thin streaks of ink
  // shooting out from it (some ending in a droplet), a few loose drops, and fine specks.
  function blotSvg() {
    const rand = (a, b) => a + Math.random() * (b - a);
    const f = n => n.toFixed(1);
    const clamp = v => Math.min(97, Math.max(3, v));
    const cx = rand(46, 54), cy = rand(46, 54);
    let shapes = "";

    // main blot with a wobbly edge
    const n = 10, pts = [];
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2, r = rand(19, 26);
      pts.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]);
    }
    let d = "";
    for (let i = 0; i <= n; i++) {
      const [x1, y1] = pts[i % n], [x2, y2] = pts[(i + 1) % n];
      const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
      d += i ? ` Q${f(x1)} ${f(y1)} ${f(mx)} ${f(my)}` : `M${f(mx)} ${f(my)}`;
    }
    shapes += `<path d="${d}Z"/>`;

    // streaks radiating from the impact point: wide where they leave the blot, tapering to a point
    const rays = Math.floor(rand(9, 14));
    const turn = rand(0, Math.PI * 2);
    for (let i = 0; i < rays; i++) {
      const a = turn + (i / rays) * Math.PI * 2 + rand(-0.2, 0.2);
      const len = rand(33, 47), half = rand(1.6, 3.4);
      const bx = cx + Math.cos(a) * 16, by = cy + Math.sin(a) * 16;
      const tx = clamp(cx + Math.cos(a) * len), ty = clamp(cy + Math.sin(a) * len);
      const px = Math.cos(a + Math.PI / 2) * half, py = Math.sin(a + Math.PI / 2) * half;
      shapes += `<path d="M${f(bx + px)} ${f(by + py)} L${f(tx)} ${f(ty)} L${f(bx - px)} ${f(by - py)}Z"/>`;
      if (Math.random() < 0.45) {
        // droplet just past the tip
        const dx = clamp(cx + Math.cos(a) * (len + 3)), dy = clamp(cy + Math.sin(a) * (len + 3));
        shapes += `<circle cx="${f(dx)}" cy="${f(dy)}" r="${f(rand(1.8, 3.4))}"/>`;
      }
    }

    // a few loose drops between the streaks, stretched along their flight
    const drops = Math.floor(rand(2, 5));
    for (let i = 0; i < drops; i++) {
      const a = rand(0, Math.PI * 2), dist = rand(34, 44), r = rand(1.8, 3.2);
      const x = clamp(cx + Math.cos(a) * dist), y = clamp(cy + Math.sin(a) * dist);
      shapes += `<ellipse cx="${f(x)}" cy="${f(y)}" rx="${f(r * 1.6)}" ry="${f(r)}" transform="rotate(${f((a * 180) / Math.PI)} ${f(x)} ${f(y)})"/>`;
    }

    // fine specks
    const specks = Math.floor(rand(5, 10));
    for (let i = 0; i < specks; i++) {
      const a = rand(0, Math.PI * 2), dist = rand(28, 47);
      const x = Math.min(97, Math.max(3, cx + Math.cos(a) * dist));
      const y = Math.min(97, Math.max(3, cy + Math.sin(a) * dist));
      shapes += `<circle cx="${f(x)}" cy="${f(y)}" r="${f(rand(0.8, 2))}"/>`;
    }

    return `<svg viewBox="0 0 100 100" aria-hidden="true"><g style="fill:var(--ink)">${shapes}</g></svg>`;
  }

  function place(el, r, c) { el.style.transform = `translate(${c * 100}%, ${r * 100}%)`; }

  function drawSlots() {
    slotsEl.innerHTML = "";
    for (let r = 0; r < N; r++)
      for (let c = 0; c < N; c++) {
        const s = document.createElement("div");
        s.className = "slot";
        if (blots.has(key(r, c))) { s.classList.add("blot"); s.innerHTML = blotSvg(); s.setAttribute("aria-label", "Ink blot"); }
        place(s, r, c);
        slotsEl.appendChild(s);
      }
  }

  function paintTile(t, anim) {
    const lv = level(t.v);
    t.el.innerHTML = `<div class="face lv${lv}${anim ? " " + anim : ""}">` +
      `<span class="len">${label(t.v)}</span>` +
      `<span class="rule" style="--w:${Math.min(80, ((lv + 1) / 8) * 80)}%"></span></div>`;
    t.el.setAttribute("aria-label", label(t.v));
  }

  function addTile(v, r, c, anim) {
    const el = document.createElement("div");
    el.className = "tile";
    const t = { id: nextId++, v, r, c, el };
    place(el, r, c);
    paintTile(t, anim);
    tilesEl.appendChild(el);
    tiles.push(t);
    return t;
  }

  function emptyCells() {
    const taken = new Set(tiles.map(t => key(t.r, t.c)));
    const out = [];
    for (let r = 0; r < N; r++)
      for (let c = 0; c < N; c++)
        if (!blots.has(key(r, c)) && !taken.has(key(r, c))) out.push([r, c]);
    return out;
  }

  function spawn() {
    const free = emptyCells();
    if (!free.length) return;
    const [r, c] = free[Math.floor(Math.random() * free.length)];
    addTile(Math.random() < 0.9 ? 1 : 2, r, c, "appear");
  }

  function newGame() {
    if (pending) { clearTimeout(pending.timer); pending = null; }
    tiles = [];
    tilesEl.innerHTML = "";
    score = 0; won = false; over = false;
    scoreEl.textContent = 0;
    overlay.hidden = true;
    // blots go in different rows and columns so they never wall off a whole line together
    blots = new Set();
    const rows = shuffle([0, 1, 2, 3]), cols = shuffle([0, 1, 2, 3]);
    for (let i = 0; i < BLOTS; i++) blots.add(key(rows[i], cols[i]));
    drawSlots();
    spawn(); spawn();
  }

  function shuffle(a) {
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // Each line, listed from the side the tiles slide toward, split into runs between blots.
  function runs(dir) {
    const out = [];
    for (let i = 0; i < N; i++) {
      let line = [];
      for (let j = 0; j < N; j++) {
        const k = dir === "left" || dir === "up" ? j : N - 1 - j;
        line.push(dir === "left" || dir === "right" ? [i, k] : [k, i]);
      }
      let run = [];
      for (const [r, c] of line) {
        if (blots.has(key(r, c))) { if (run.length) out.push(run); run = []; }
        else run.push([r, c]);
      }
      if (run.length) out.push(run);
    }
    return out;
  }

  function move(dir) {
    if (over || !overlay.hidden) return;
    finishPending();
    initAudio();
    const at = new Map(tiles.map(t => [key(t.r, t.c), t]));
    const merges = [];
    let moved = false;

    for (const run of runs(dir)) {
      const line = run.map(([r, c]) => at.get(key(r, c))).filter(Boolean);
      let slot = 0;
      for (let i = 0; i < line.length; slot++) {
        const [r, c] = run[slot];
        const a = line[i], b = line[i + 1];
        if (b && a.v === b.v) {
          merges.push({ keep: a, gone: b });
          for (const t of [a, b]) { t.r = r; t.c = c; place(t.el, r, c); }
          moved = true;
          i += 2;
        } else {
          if (a.r !== r || a.c !== c) moved = true;
          a.r = r; a.c = c; place(a.el, r, c);
          i += 1;
        }
      }
    }
    if (!moved) return;

    scratch(0, 0.12);
    pending = { timer: setTimeout(finishPending, SLIDE_MS), merges };
  }

  // After the slide animation: join merged tiles, add a new one, check for a win or a full board.
  function finishPending() {
    if (!pending) return;
    clearTimeout(pending.timer);
    const { merges } = pending;
    pending = null;

    let biggest = 0;
    for (const { keep, gone } of merges) {
      gone.el.remove();
      tiles = tiles.filter(t => t !== gone);
      keep.v *= 2;
      score += keep.v;
      biggest = Math.max(biggest, keep.v);
      paintTile(keep, "pop");
    }
    if (biggest) playMerge(biggest);
    scoreEl.textContent = score;
    if (score > best) {
      best = score;
      bestEl.textContent = best;
      try { localStorage.setItem("ruler-best", best); } catch (e) {}
    }
    spawn();

    if (!won && biggest >= GOAL) {
      won = true;
      playVictory();
      showOverlay("Over a metre!", `You drew a ${label(biggest)} line. Keep going to see how long it gets.`,
        "Keep going", () => { overlay.hidden = true; if (!canMove()) outOfRoom(); }, true);
    } else if (!canMove()) {
      outOfRoom();
    }
  }

  function outOfRoom() {
    over = true;
    playDefeat();
    const longest = Math.max(...tiles.map(t => t.v));
    showOverlay("Out of room", `Your longest line was ${label(longest)}. Drawn: ${score}.`, "New game", newGame, false);
  }

  function canMove() {
    if (emptyCells().length) return true;
    const at = new Map(tiles.map(t => [key(t.r, t.c), t.v]));
    for (let r = 0; r < N; r++)
      for (let c = 0; c < N; c++) {
        const v = at.get(key(r, c));
        if (v === undefined) continue;
        if (at.get(key(r, c + 1)) === v && c + 1 < N) return true;
        if (at.get(key(r + 1, c)) === v && r + 1 < N) return true;
      }
    return false;
  }

  function showOverlay(title, text, mainLabel, action, withAlt) {
    ovTitle.textContent = title;
    ovText.textContent = text;
    ovMain.textContent = mainLabel;
    ovAction = action;
    ovAlt.hidden = !withAlt;
    overlay.hidden = false;
    ovMain.focus({ preventScroll: true });
  }

  // ---- input ----
  const KEYS = {
    ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right",
    w: "up", s: "down", a: "left", d: "right", W: "up", S: "down", A: "left", D: "right",
  };
  document.addEventListener("keydown", e => {
    const dir = KEYS[e.key];
    if (!dir || e.ctrlKey || e.metaKey || e.altKey) return;
    e.preventDefault();
    move(dir);
  });

  let touch = null;
  boardEl.addEventListener("touchstart", e => { touch = e.touches[0]; }, { passive: true });
  boardEl.addEventListener("touchend", e => {
    if (!touch) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touch.clientX, dy = t.clientY - touch.clientY;
    touch = null;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
    move(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up"));
  });

  ovMain.addEventListener("click", () => ovAction && ovAction());
  ovAlt.addEventListener("click", newGame);
  document.getElementById("new-game").addEventListener("click", newGame);

  newGame();
})();
</script>
