<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>try{var t=localStorage.getItem("theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
<title>Graph Paper Tic-Tac-Toe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Chivo+Mono:wght@400;600&display=swap">
<style>
  /* Layout: one centered column — title and mode switch, score row, square 3×3 board, status and links below. */
  :root {
    --paper: #eef3f7;
    --board: #fbfdff;
    --grid: #cfe0ee;
    --grid-major: #a9c6de;
    --ink: #1d2a44;
    --ink-soft: #5b6a85;
    --apple: #d6372b;
    --win: #e8a400;
    --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
    --font-mono: "Chivo Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #0c1830; --board: #10203d; --grid: #1c3358; --grid-major: #2a4a7a;
      --ink: #e8f0ff; --ink-soft: #8ea3c7; --apple: #ff6a55; --win: #ffc93d; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #0c1830; --board: #10203d; --grid: #1c3358; --grid-major: #2a4a7a;
    --ink: #e8f0ff; --ink-soft: #8ea3c7; --apple: #ff6a55; --win: #ffc93d; color-scheme: dark;
  }

  [hidden] { display: none !important; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-mono);
    display: flex;
    justify-content: center;
    padding-block: 60px 24px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .wrap { width: 100%; max-width: 460px; display: flex; flex-direction: column; gap: 16px; }

  header { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 {
    font-family: var(--font-display); font-weight: 800; font-size: 2.1rem;
    letter-spacing: -0.03em; line-height: 1; margin: 0; text-wrap: balance;
  }

  .modes { display: flex; border: 2px solid var(--ink); border-radius: 4px; overflow: hidden; }
  .modes button {
    font: 600 0.8rem var(--font-mono); padding: 8px 12px; border: 0; cursor: pointer;
    background: var(--board); color: var(--ink);
  }
  .modes button + button { border-left: 2px solid var(--ink); }
  .modes button[aria-pressed="true"] { background: var(--ink); color: var(--board); }
  .modes button:focus-visible { outline: 3px solid var(--apple); outline-offset: -3px; }

  .scores { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; font-variant-numeric: tabular-nums; }
  .score { display: flex; flex-direction: column; gap: 2px; }
  .score:nth-child(2) { align-items: center; }
  .score:nth-child(3) { align-items: flex-end; }
  .score span { font-size: 0.68rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-soft); }
  .score b { font-family: var(--font-display); font-weight: 800; font-size: 1.6rem; line-height: 1; }
  .score.x b { color: var(--ink); }
  .score.o b { color: var(--apple); }

  .board {
    position: relative; width: 100%; max-width: 100%; aspect-ratio: 1;
    background-color: var(--board);
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: calc(100% / 12) calc(100% / 12);
    border: 2px solid var(--ink); border-radius: 4px;
    box-shadow: 6px 6px 0 var(--grid-major);
    display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr);
  }
  .cell {
    background: transparent; border: 0; padding: 12%; cursor: pointer; color: var(--ink);
    border-right: 3px solid var(--ink); border-bottom: 3px solid var(--ink);
  }
  .cell:nth-child(3n) { border-right: 0; }
  .cell:nth-child(n+7) { border-bottom: 0; }
  .cell:disabled { cursor: default; }
  .cell:not(:disabled):hover { background: color-mix(in srgb, var(--grid) 45%, transparent); }
  .cell:focus-visible { outline: 3px solid var(--apple); outline-offset: -6px; }
  .cell svg { display: block; width: 100%; height: 100%; overflow: visible; }

  .mark { fill: none; stroke-width: 11; stroke-linecap: round; }
  .mark.x { stroke: var(--ink); }
  .mark.o { stroke: var(--apple); }
  .mark path, .mark circle { stroke-dasharray: 300; stroke-dashoffset: 300; animation: draw 0.28s ease-out forwards; }
  .mark path + path { animation-delay: 0.12s; }
  @keyframes draw { to { stroke-dashoffset: 0; } }

  .winline {
    position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none;
  }
  .winline line {
    stroke-linecap: round;
    stroke-dasharray: 400; stroke-dashoffset: 400; animation: draw 0.35s ease-out 0.25s forwards;
  }
  /* a board-colored halo under the line keeps it separate from the marks it crosses */
  .winline .halo { stroke: var(--board); stroke-width: 22; }
  .winline .stroke { stroke: var(--win); stroke-width: 13; }

  .bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .status { font-family: var(--font-display); font-weight: 800; font-size: 1.25rem; letter-spacing: -0.01em; min-height: 1.5em; }
  .actions { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }

  .btn {
    font: 600 0.9rem var(--font-mono); color: var(--board); background: var(--ink);
    border: 2px solid var(--ink); border-radius: 4px; padding: 10px 18px; cursor: pointer;
  }
  .btn:hover { filter: brightness(1.15); }
  .ghost {
    font: 600 0.9rem var(--font-mono); color: var(--ink); text-decoration: none;
    border: 2px solid var(--ink); border-radius: 4px; padding: 8px 14px;
  }
  .ghost:hover { background: var(--grid); }
  .btn:focus-visible, .ghost:focus-visible { outline: 3px solid var(--apple); outline-offset: 2px; }
  .hint { font-size: 0.75rem; color: var(--ink-soft); }

  @media (prefers-reduced-motion: reduce) {
    .mark path, .mark circle, .winline line { animation: none; stroke-dashoffset: 0; }
  }

  /* light/dark switch, top right on every page of the site; the choice is shared through localStorage "theme" */
  .theme-toggle {
    position: absolute; top: 12px; right: max(16px, env(safe-area-inset-right, 0px)); z-index: 10;
    width: 36px; height: 36px; padding: 0; display: grid; place-items: center; border-radius: 50%; cursor: pointer;
    color: var(--ink); background: var(--surface, var(--board, transparent)); border: 1px solid var(--line, var(--grid-major));
    transition: border-color 0.15s, color 0.15s;
  }
  .theme-toggle:hover { color: var(--accent, var(--apple)); border-color: var(--accent, var(--apple)); }
  .theme-toggle:focus-visible { outline: 3px solid var(--accent, var(--apple)); outline-offset: 3px; }
  .theme-toggle svg { width: 18px; height: 18px; display: block; }
</style>

<button class="theme-toggle" type="button"></button>
<script>
  // Light/dark switch. Follows the device until clicked, then remembers the choice for every page on this site.
  (function () {
    var root = document.documentElement, btn = document.querySelector(".theme-toggle"), mq = matchMedia("(prefers-color-scheme: dark)");
    var SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 1.5v2.5M12 20v2.5M1.5 12H4M20 12h2.5M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8"/></svg>';
    var MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z"/></svg>';
    function current() { return root.dataset.theme || (mq.matches ? "dark" : "light"); }
    function paint() {
      var dark = current() === "dark", label = dark ? "Switch to light mode" : "Switch to dark mode";
      btn.innerHTML = dark ? SUN : MOON; btn.setAttribute("aria-label", label); btn.title = label;
    }
    function apply(t) { root.dataset.theme = t; paint(); window.dispatchEvent(new Event("themechange")); }
    btn.addEventListener("click", function () {
      var t = current() === "dark" ? "light" : "dark";
      try { localStorage.setItem("theme", t); } catch (e) {}
      apply(t);
    });
    window.addEventListener("storage", function (e) { if (e.key === "theme" && (e.newValue === "light" || e.newValue === "dark")) apply(e.newValue); });
    mq.addEventListener("change", paint);
    paint();
  })();
</script>

<div class="wrap">
  <header>
    <h1>Tic-Tac-Toe</h1>
    <div class="modes" role="group" aria-label="Opponent">
      <button id="mode-cpu" aria-pressed="true">vs Computer</button>
      <button id="mode-pvp" aria-pressed="false">2 Players</button>
    </div>
  </header>

  <div class="scores">
    <div class="score x"><span id="label-x">You (X)</span><b id="score-x">0</b></div>
    <div class="score"><span>Draws</span><b id="score-d">0</b></div>
    <div class="score o"><span id="label-o">Computer (O)</span><b id="score-o">0</b></div>
  </div>

  <div class="board" id="board">
    <svg class="winline" id="winline" viewBox="0 0 300 300" aria-hidden="true"></svg>
  </div>

  <div class="bar">
    <div class="status" id="status" aria-live="polite">Your turn</div>
    <button class="btn" id="again" hidden>Next round</button>
  </div>

  <div class="actions">
    <a class="ghost" href="../index.html">← All games</a>
    <span class="hint">Players take turns going first</span>
  </div>
</div>

<script>
(() => {
  const LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  const MISTAKE_CHANCE = 0.2; // how often the computer picks a random square instead of the best one

  const boardEl = document.getElementById("board");
  const winlineEl = document.getElementById("winline");
  const statusEl = document.getElementById("status");
  const againBtn = document.getElementById("again");
  const cpuBtn = document.getElementById("mode-cpu");
  const pvpBtn = document.getElementById("mode-pvp");
  const scoreEls = { X: document.getElementById("score-x"), O: document.getElementById("score-o"), D: document.getElementById("score-d") };
  const labelX = document.getElementById("label-x");
  const labelO = document.getElementById("label-o");

  const cells = [];
  for (let i = 0; i < 9; i++) {
    const b = document.createElement("button");
    b.className = "cell";
    b.setAttribute("aria-label", `Square ${i + 1}, empty`);
    b.addEventListener("click", () => humanMove(i));
    boardEl.insertBefore(b, winlineEl);
    cells.push(b);
  }

  let mode = "cpu", board, turn, starter = "O", over, scores, thinking;

  // ---- sound (synthesized; the context is created on the first click, which is a user gesture) ----
  let audio = null, noise = null;
  function initAudio() {
    try {
      if (!audio) {
        audio = new (window.AudioContext || window.webkitAudioContext)();
        // one second of white noise, reused for every pencil stroke
        noise = audio.createBuffer(1, audio.sampleRate, audio.sampleRate);
        const data = noise.getChannelData(0);
        for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
      }
      if (audio.state === "suspended") audio.resume();
    } catch (e) { audio = null; }
  }

  // A soft pencil stroke: noise kept to the low-mid range, with a gentle swell and fade.
  function scratch(startAt, dur) {
    if (!audio) return;
    const t = audio.currentTime + startAt;
    const src = audio.createBufferSource();
    src.buffer = noise;
    src.playbackRate.value = 0.9 + Math.random() * 0.2;
    const band = audio.createBiquadFilter();
    band.type = "bandpass";
    band.frequency.setValueAtTime(1100 + Math.random() * 250, t);
    band.frequency.linearRampToValueAtTime(1500, t + dur);
    band.Q.value = 0.7;
    // cut the hiss above the pencil's body so it doesn't sound sharp
    const soften = audio.createBiquadFilter();
    soften.type = "lowpass";
    soften.frequency.value = 2200;
    const gain = audio.createGain();
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(0.06, t + 0.05);
    gain.gain.setValueAtTime(0.05, t + dur * 0.7);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(band).connect(soften).connect(gain).connect(audio.destination);
    src.start(t, Math.random() * 0.5, dur + 0.05);
  }

  function tone(type, from, to, startAt, dur, vol) {
    if (!audio) return;
    const t = audio.currentTime + startAt;
    const osc = audio.createOscillator();
    const gain = audio.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(from, t);
    osc.frequency.exponentialRampToValueAtTime(to, t + dur);
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(vol, t + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(audio.destination);
    osc.start(t);
    osc.stop(t + dur + 0.02);
  }

  // timed to match the drawing animation: X is two quick strokes, O is one longer loop
  function playMark(m) {
    if (m === "X") { scratch(0, 0.14); scratch(0.13, 0.14); }
    else scratch(0, 0.28);
  }

  function playVictory() {
    [523, 659, 784].forEach((f, i) => tone("square", f, f, 0.5 + i * 0.12, 0.12, 0.08));
    tone("square", 1047, 1047, 0.86, 0.5, 0.09);
    tone("triangle", 523, 523, 0.86, 0.5, 0.15);
  }

  function playDefeat() {
    tone("triangle", 440, 415, 0.5, 0.18, 0.2);
    tone("triangle", 349, 330, 0.68, 0.18, 0.2);
    tone("triangle", 262, 110, 0.86, 0.5, 0.22);
  }

  function newMatch() {
    scores = { X: 0, O: 0, D: 0 };
    starter = "O";
    updateScores();
    labelX.textContent = mode === "cpu" ? "You (X)" : "Player X";
    labelO.textContent = mode === "cpu" ? "Computer (O)" : "Player O";
    newRound();
  }

  function newRound() {
    clearTimeout(thinking);
    board = Array(9).fill(null);
    starter = starter === "X" ? "O" : "X";
    turn = starter;
    over = false;
    winlineEl.innerHTML = "";
    againBtn.hidden = true;
    cells.forEach((c, i) => {
      c.innerHTML = "";
      c.disabled = false;
      c.setAttribute("aria-label", `Square ${i + 1}, empty`);
    });
    nextTurn();
  }

  function nextTurn() {
    if (mode === "cpu" && turn === "O") {
      statusEl.textContent = "Computer is thinking…";
      setCellsLocked(true);
      thinking = setTimeout(() => { setCellsLocked(false); place(computerMove()); }, 450);
    } else {
      statusEl.textContent = mode === "cpu" ? "Your turn" : `${turn}'s turn`;
    }
  }

  function setCellsLocked(locked) {
    cells.forEach((c, i) => { c.disabled = locked || board[i] !== null; });
  }

  function humanMove(i) {
    if (over || board[i] || (mode === "cpu" && turn === "O")) return;
    initAudio();
    place(i);
  }

  function place(i) {
    board[i] = turn;
    const c = cells[i];
    c.disabled = true;
    c.setAttribute("aria-label", `Square ${i + 1}, ${turn}`);
    c.innerHTML = turn === "X"
      ? '<svg viewBox="0 0 100 100"><g class="mark x"><path d="M18 18 L82 82"/><path d="M82 18 L18 82"/></g></svg>'
      : '<svg viewBox="0 0 100 100"><g class="mark o"><circle cx="50" cy="50" r="33"/></g></svg>';
    playMark(turn);

    const line = winningLine(board);
    if (line) return finish(turn, line);
    if (board.every(Boolean)) return finish(null);
    turn = turn === "X" ? "O" : "X";
    nextTurn();
  }

  function finish(winner, line) {
    over = true;
    cells.forEach(c => c.disabled = true);
    scores[winner || "D"]++;
    updateScores();
    if (line) drawWinLine(line);
    // the jingle waits half a second so the last pencil stroke and win line finish first
    if (winner) (mode === "cpu" && winner === "O") ? playDefeat() : playVictory();
    if (!winner) statusEl.textContent = "It's a draw";
    else if (mode === "cpu") statusEl.textContent = winner === "X" ? "You win!" : "Computer wins";
    else statusEl.textContent = `${winner} wins!`;
    againBtn.hidden = false;
    againBtn.focus({ preventScroll: true });
  }

  function updateScores() {
    scoreEls.X.textContent = scores.X;
    scoreEls.O.textContent = scores.O;
    scoreEls.D.textContent = scores.D;
  }

  function drawWinLine([a, , c]) {
    const pt = i => [50 + (i % 3) * 100, 50 + Math.floor(i / 3) * 100];
    const [x1, y1] = pt(a), [x2, y2] = pt(c);
    // stretch the line a little past the outer marks
    const dx = (x2 - x1) / 200 * 30, dy = (y2 - y1) / 200 * 30;
    const pos = `x1="${x1 - dx}" y1="${y1 - dy}" x2="${x2 + dx}" y2="${y2 + dy}"`;
    winlineEl.innerHTML = `<line class="halo" ${pos}/><line class="stroke" ${pos}/>`;
  }

  function winningLine(b) {
    return LINES.find(([a, c, d]) => b[a] && b[a] === b[c] && b[a] === b[d]) || null;
  }

  // ---- computer ----
  function computerMove() {
    const empty = board.map((v, i) => v ? null : i).filter(i => i !== null);
    if (Math.random() < MISTAKE_CHANCE) return empty[Math.floor(Math.random() * empty.length)];
    let bestScore = -Infinity, bestMoves = [];
    for (const i of empty) {
      board[i] = "O";
      const s = minimax(board, "X", 1);
      board[i] = null;
      if (s > bestScore) { bestScore = s; bestMoves = [i]; }
      else if (s === bestScore) bestMoves.push(i);
    }
    return bestMoves[Math.floor(Math.random() * bestMoves.length)];
  }

  // Score from O's point of view; quicker wins and slower losses score better.
  function minimax(b, player, depth) {
    const line = winningLine(b);
    if (line) return b[line[0]] === "O" ? 10 - depth : depth - 10;
    if (b.every(Boolean)) return 0;
    let best = player === "O" ? -Infinity : Infinity;
    for (let i = 0; i < 9; i++) {
      if (b[i]) continue;
      b[i] = player;
      const s = minimax(b, player === "O" ? "X" : "O", depth + 1);
      b[i] = null;
      best = player === "O" ? Math.max(best, s) : Math.min(best, s);
    }
    return best;
  }

  // ---- controls ----
  function setMode(m) {
    if (m === mode) return;
    mode = m;
    cpuBtn.setAttribute("aria-pressed", m === "cpu");
    pvpBtn.setAttribute("aria-pressed", m === "pvp");
    newMatch();
  }
  cpuBtn.addEventListener("click", () => setMode("cpu"));
  pvpBtn.addEventListener("click", () => setMode("pvp"));
  againBtn.addEventListener("click", () => { initAudio(); newRound(); });

  newMatch();
})();
</script>
